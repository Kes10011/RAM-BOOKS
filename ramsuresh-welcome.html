<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ramsuresh Books — Welcome</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg1:#f6ecdb;--bg2:#d8c19b;--ink:#2a1c12;--accent:#b8651b;--bub:#fffaf0;--bubink:#2a1c12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a2a1f;--bg2:#0f0b09;--ink:#f3e9dc;--accent:#e8a23d}}
:root[data-theme="dark"]{--bg1:#3a2a1f;--bg2:#0f0b09;--ink:#f3e9dc;--accent:#e8a23d}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 55%,var(--bg1) 0%,var(--bg2) 75%);color:var(--ink);font-family:Inter,system-ui,sans-serif}
#stage{position:absolute;inset:0;cursor:pointer}
#stage canvas{display:block;width:100%;height:100%}
header,footer{position:absolute;left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:20px 28px;z-index:3;pointer-events:none}
header{top:env(safe-area-inset-top,0px)}footer{bottom:env(safe-area-inset-bottom,0px);font-size:12px;letter-spacing:.2em;text-transform:uppercase;opacity:.65}
.logo{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:20px;letter-spacing:.04em}
.logo span{color:var(--accent)}
.skip{pointer-events:auto;background:none;border:0;color:var(--ink);font:500 12px Inter,sans-serif;letter-spacing:.18em;text-transform:uppercase;cursor:pointer;opacity:.7;border-bottom:1px solid currentColor;padding-bottom:2px}
.skip:hover{opacity:1}
#bubble{position:absolute;z-index:4;left:50%;top:18%;transform:translate(-50%,-100%);background:var(--bub);color:var(--bubink);border:0;border-radius:18px;padding:14px 22px;font:700 clamp(16px,2.2vw,22px)/1.3 'Playfair Display',Georgia,serif;text-align:center;cursor:pointer;box-shadow:0 12px 30px rgba(0,0,0,.28);max-width:min(80vw,300px);opacity:0;transition:opacity .8s .6s;animation:bob 2.6s ease-in-out infinite}
#bubble.on{opacity:1}
#bubble small{display:block;font:500 11px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-top:4px}
#bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:18px;height:18px;background:var(--bub);transform:translateX(-50%) rotate(45deg);border-radius:0 0 4px 0}
@keyframes bob{50%{margin-top:-8px}}
#veil{position:fixed;inset:0;z-index:9;background:#0f0b09;color:#f3e9dc;display:flex;align-items:center;justify-content:center;font:italic 500 clamp(20px,4vw,34px) 'Playfair Display',Georgia,serif;opacity:0;pointer-events:none;transition:opacity .8s}
body.leaving #veil{opacity:1;pointer-events:auto}
</style>
</head>
<body>
<header><div class="logo">Ramsuresh <span>Books</span></div><button class="skip" id="skip">Skip intro</button></header>
<div id="stage"></div>
<button id="bubble">Welcome! Click here to start reading<small>Enter the library →</small></button>
<footer><span>Stories &amp; Novels</span><span>Move your mouse</span></footer>
<div id="veil">Opening the first page…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// >>> Set this to your real site address, e.g. "home.html" or "https://ramsureshbooks.com"
const SITE_URL = "#";

function enter(){
  document.body.classList.add('leaving');
  setTimeout(()=>{ if(SITE_URL!=="#") location.href=SITE_URL; else document.body.classList.remove('leaving'); },1400);
}
const bubble=document.getElementById('bubble');
bubble.onclick=e=>{e.stopPropagation();enter()};
document.getElementById('skip').onclick=enter;

try{
const stage=document.getElementById('stage');
const R=new THREE.WebGLRenderer({antialias:true,alpha:true});
R.setPixelRatio(Math.min(devicePixelRatio,2));stage.appendChild(R.domElement);
const S=new THREE.Scene(),C=new THREE.PerspectiveCamera(35,1,.1,60);
S.add(new THREE.HemisphereLight(0xfff1dd,0x2a1f18,.95));
const key=new THREE.DirectionalLight(0xffffff,.9);key.position.set(3,4,6);S.add(key);
const rim=new THREE.PointLight(0xe8a23d,1.4,25);rim.position.set(-5,2,-2);S.add(rim);

const M=(c,r=.6,m=0)=>new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});
const cas=M(0x3b3d42,.45,.35);const gold=M(0xe8a23d,.3,.6);
const fig=new THREE.Group();S.add(fig);
const box=(w,h,d,m,x,y,z,p=fig)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);o.position.set(x,y,z);p.add(o);return o};
const cyl=(r,h,m,x,y,z,p=fig)=>{const o=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,20),m);o.position.set(x,y,z);p.add(o);return o};

// TV head
const head=new THREE.Group();head.position.set(0,0,0);fig.add(head);
box(1.75,1.4,1.2,cas,0,0,0,head);
box(.95,.85,.55,cas,0,-.05,-.85,head);
box(1.52,1.16,.06,M(0x111214,.4),0,0,.6,head);
const cv=document.createElement('canvas');cv.width=320;cv.height=240;
const cx=cv.getContext('2d'),tex=new THREE.CanvasTexture(cv);
const scr=new THREE.Mesh(new THREE.PlaneGeometry(1.38,1.04),new THREE.MeshBasicMaterial({map:tex}));
scr.position.z=.64;head.add(scr);
[-1,1].forEach(s=>{const a=cyl(.022,1.1,cas,s*.35,1.0,-.1,head);a.rotation.z=-s*.42;
  const b=new THREE.Mesh(new THREE.SphereGeometry(.06,12,12),gold);b.position.set(s*.35+s*.23,1.5,-.1);head.add(b);});
cyl(.05,.05,gold,.62,-.5,.62,head).rotation.x=Math.PI/2;

const P={x:0,y:0,sx:0,sy:0,hover:false};
function drawFace(t){
  cx.fillStyle='#0d2b22';cx.fillRect(0,0,320,240);
  const g=cx.createRadialGradient(160,120,20,160,120,230);
  g.addColorStop(0,'rgba(120,255,190,.28)');g.addColorStop(1,'rgba(0,0,0,.55)');
  cx.fillStyle=g;cx.fillRect(0,0,320,240);
  cx.shadowColor='#5dffb0';cx.shadowBlur=18;cx.fillStyle=cx.strokeStyle='#8dffc4';
  const bl=(t%4)<.14?.12:1,ox=P.sx*14,oy=P.sy*8;
  [105,215].forEach(x=>{
    if(P.hover){cx.lineWidth=13;cx.lineCap='round';cx.beginPath();cx.arc(x+ox,125+oy,26,Math.PI*1.08,Math.PI*1.92);cx.stroke();}
    else cx.fillRect(x-22+ox,90+oy+(1-bl)*25,44,52*bl);});
  cx.lineWidth=11;cx.lineCap='round';cx.beginPath();
  cx.arc(160+ox*.6,150+oy,P.hover?52:38,.12*Math.PI,.88*Math.PI);cx.stroke();
  cx.shadowBlur=0;cx.fillStyle='rgba(0,0,0,.22)';
  for(let y=0;y<240;y+=4)cx.fillRect(0,y,320,2);
  tex.needsUpdate=true;
}

function size(){
  const w=stage.clientWidth,h=stage.clientHeight,a=w/h;R.setSize(w,h,false);C.aspect=a;
  C.position.set(0,.35,7.5*Math.max(1,.55/a));C.lookAt(0,.35,0);C.updateProjectionMatrix();
}
addEventListener('resize',size);size();
addEventListener('pointermove',e=>{P.x=e.clientX/innerWidth*2-1;P.y=e.clientY/innerHeight*2-1});
stage.addEventListener('pointerenter',()=>{P.hover=true});
stage.addEventListener('pointerleave',()=>{P.hover=false});
stage.addEventListener('click',enter);

const anchor=new THREE.Vector3(),clk=new THREE.Clock();
(function tick(){
  requestAnimationFrame(tick);const t=clk.getElapsedTime();
  P.sx+=(P.x-P.sx)*.06;P.sy+=(P.y-P.sy)*.06;
  head.rotation.y=P.sx*.55;head.rotation.x=P.sy*.28;
  fig.position.y=Math.sin(t*1.6)*.06;
  drawFace(t);R.render(S,C);
  anchor.set(0,2.0,0).applyMatrix4(fig.matrixWorld).project(C);
  bubble.style.left=((anchor.x+1)/2*100)+'%';bubble.style.top=((1-anchor.y)/2*100)+'%';
})();
}catch(err){
  bubble.style.top='50%';bubble.style.animation='none'; // fallback if WebGL is unavailable
}
setTimeout(()=>bubble.classList.add('on'),400);
</script>
</body>
</html>
